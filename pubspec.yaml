name: neom_docs
description: Doc generation for Flutter. Convert markdown to PDF, DOCX, and XLSX
  with cross-platform download.
version: 1.1.0
homepage: https://github.com/Open-Neom/neom_docs
repository: https://github.com/Open-Neom/neom_docs
issue_tracker: https://github.com/Open-Neom/neom_docs/issues
topics:
  - pdf
  - docx
  - excel
  - document-generation
  - markdown

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  pdf: ^3.13.0

  # OOXML (DOCX/XLSX) handled natively via archive + xml — replaces the
  # abandoned docx_to_text package and the excel package, whose constraints
  # (xml <7, archive <4) conflicted with pdf ^3.13 and image ^4.9.
  archive: ">=3.6.1 <5.0.0"
  xml: ">=6.3.0 <8.0.0"

  # Logger
  sint_sentinel: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/fonts/
